:root{
  /* Pure white ground, navy-black ink, McKinsey-deck accent set: navy (structural),
     cobalt (interactive/highlight), gold (emphasis numbers), coral (ambition/lead tier). */
  --ink:#141a29;
  --ink-soft:#565f75;
  --paper:#ffffff;
  --paper-raise:#f7f8fb;
  --line:#e2e4ec;
  --card:#ffffff;
  --good:#1f8a5f;
  --c-navy:#1b3a6b;
  --c-navy-deep:#12274a;
  --c-navy-pale:#eaeff7;
  --c-cobalt:#2e6ff2;
  --c-gold:#c8940a;
  --c-coral:#e0543d;
  --c-scale:#e35a10;
  --c-scale-deep:#b8470a;
  --c-scale-pale:#fdeee3;
  --c-teal:#1a3c36;
  --c-teal-deep:#0f2621;
  --c-teal-pale:#e9f1ef;
  --c-jade:#0f9d78;
  --c-purple:#7c4fd1;
  --shadow: 0 1px 2px rgba(20,26,41,.05), 0 8px 24px -8px rgba(20,26,41,.10);
  --shadow-lg: 0 4px 12px rgba(20,26,41,.07), 0 28px 56px -20px rgba(20,26,41,.20);
  --radius: 14px;
  --serif: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --sans: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

:root[data-theme="dark"]{
  --ink:#eef1f7;
  --ink-soft:#a7aec2;
  --paper:#0e1220;
  --paper-raise:#161b2c;
  --line:#2a3149;
  --card:#161b2c;
  --good:#4fbf8f;
  --c-navy:#5b85c9;
  --c-navy-deep:#8caede;
  --c-navy-pale:#1b2540;
  --c-cobalt:#6c9bff;
  --c-gold:#e8bf4d;
  --c-coral:#f0806b;
  --c-scale:#ff8a4c;
  --c-scale-deep:#ffab7a;
  --c-scale-pale:#2c1c12;
  --c-teal:#5fb8a8;
  --c-teal-deep:#8fcfc3;
  --c-teal-pale:#132420;
  --c-jade:#3ddba0;
  --c-purple:#a583ec;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
  --shadow-lg: 0 4px 10px rgba(0,0,0,.4), 0 24px 48px -16px rgba(0,0,0,.6);
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eef1f7;
    --ink-soft:#a7aec2;
    --paper:#0e1220;
    --paper-raise:#161b2c;
    --line:#2a3149;
    --card:#161b2c;
    --good:#4fbf8f;
    --c-navy:#5b85c9;
    --c-navy-deep:#8caede;
    --c-navy-pale:#1b2540;
    --c-cobalt:#6c9bff;
    --c-gold:#e8bf4d;
    --c-coral:#f0806b;
    --c-scale:#ff8a4c;
    --c-scale-deep:#ffab7a;
    --c-scale-pale:#2c1c12;
    --c-teal:#5fb8a8;
    --c-teal-deep:#8fcfc3;
    --c-teal-pale:#132420;
    --c-jade:#3ddba0;
    --c-purple:#a583ec;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
    --shadow-lg: 0 4px 10px rgba(0,0,0,.4), 0 24px 48px -16px rgba(0,0,0,.6);
  }
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background .3s ease,color .3s ease;
}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;color:var(--ink);}
p{margin:0;line-height:1.6;}
a{color:inherit;text-decoration:none;}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit;}
::selection{background:var(--c-gold);color:#fff;}
.tab{font-variant-numeric:tabular-nums;}

/* ---------- layout shell ---------- */
.app{min-height:100vh;display:flex;flex-direction:column;}

/* nav rail */
.railnav{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:6px;
  padding:12px clamp(16px,4vw,32px);
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--line);
}
.railnav .brand{
  display:flex;align-items:center;margin-right:18px;flex-shrink:0;
  font-family:var(--serif);font-weight:800;font-size:15.5px;letter-spacing:.005em;
  white-space:nowrap;color:var(--ink);
}
@media (max-width:640px){ .railnav .brand{font-size:13.5px;} }
.steps-wrap{position:relative;flex:1;min-width:0;display:flex;overflow:hidden;}
.steps-wrap::after{
  content:'';position:absolute;top:0;right:0;bottom:0;width:36px;pointer-events:none;
  background:linear-gradient(90deg, transparent, var(--paper));
}
.railnav .steps{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:center;scroll-behavior:smooth;}
.railnav .steps::-webkit-scrollbar{display:none;}
.step{
  display:flex;align-items:center;gap:7px;flex-shrink:0;
  padding:8px 13px;border-radius:999px;
  font-size:13px;font-weight:600;color:var(--ink-soft);
  white-space:nowrap;transition:all .18s ease;
}
@media (max-width:920px){
  .step{padding:8px 10px;font-size:12.5px;}
  .step .lbl{display:none;}
  .step .n{opacity:.85;font-size:12.5px;}
}
.step:hover{background:var(--c-navy-pale);color:var(--ink);}
.step.active{background:var(--ink);color:var(--paper);}
:root[data-theme="dark"] .step.active{background:var(--c-navy);color:#0f1613;}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .step.active{background:var(--c-navy);color:#0f1613;} }
.step .n{font-variant-numeric:tabular-nums;opacity:.55;font-size:11px;}
.themetoggle{
  flex-shrink:0;width:32px;height:32px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;
  background:var(--c-navy-pale);color:var(--c-navy-deep);
  margin-left:8px;transition:background .2s, transform .3s cubic-bezier(.34,1.56,.64,1);
}
.themetoggle .icon{width:15px;height:15px;}
.themetoggle:hover{background:var(--line);transform:rotate(15deg);}

main{flex:1;}
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s ease, transform .6s cubic-bezier(.16,1,.3,1);}
.reveal.is-visible{opacity:1;transform:translateY(0);}
@media (prefers-reduced-motion: reduce){ .reveal{opacity:1;transform:none;transition:none;} }

/* One consistent content column everywhere: same side padding (max 120px), same effective
   content width, so the hero, model, verticals, trajectory and summary all line up. */
.wrap, .wrap-wide{max-width:1680px;margin:0 auto;padding:0 clamp(20px,6vw,120px);}
section[id]{scroll-margin-top:70px;}

/* generic chevron/arrow icon - replaces text glyphs everywhere */
.icon{width:1em;height:1em;display:inline-block;vertical-align:-0.125em;flex-shrink:0;}
.icon svg{width:100%;height:100%;display:block;}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--c-navy-deep);
}
.eyebrow .icon{width:15px;height:15px;color:var(--c-coral);}
:root[data-theme="dark"] .eyebrow{color:var(--c-navy-deep);}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .eyebrow{color:var(--c-navy-deep);} }
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--c-gold);}

.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 24px;border-radius:10px;
  font-size:14.5px;font-weight:700;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.btn-primary{background:var(--ink);color:var(--paper);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg);}
:root[data-theme="dark"] .btn-primary{background:var(--c-navy);color:#0b120f;}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn-primary{background:var(--c-navy);color:#0b120f;} }
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn-ghost:hover{border-color:var(--ink-soft);}

/* ============ COVER ============ */
.cover{
  min-height:calc(100svh - 58px);
  display:flex;flex-direction:column;justify-content:center;
  position:relative;overflow:hidden;
  background:var(--paper);
}
.cover-blueprint{
  position:absolute;top:0;bottom:0;width:min(38vw,520px);
  opacity:.16;pointer-events:none;z-index:0;
}
.cover-blueprint svg{width:100%;height:100%;}
.cover-blueprint.left{left:0;color:var(--c-navy);}
.cover-blueprint.right{right:0;transform:scaleX(-1);color:var(--c-scale);}
@media (max-width:900px){ .cover-blueprint{display:none;} }
.cover-inner{
  position:relative;z-index:1;padding-top:88px;padding-bottom:84px;
  display:flex;flex-direction:column;align-items:center;text-align:center;max-width:1400px;margin:0 auto;
  padding-left:16px;padding-right:16px;
}
.cover-title{
  font-size:clamp(25px,3.84vw,50px);line-height:1.18;font-weight:800;
  letter-spacing:-.01em;
}
.cover-title .line-scale{
  display:block;
}
.cover-title em{
  font-style:normal;font-weight:800;
  color:var(--c-scale);
}
.cover-title .scale-icon{
  display:inline-flex;vertical-align:-0.08em;width:0.7em;height:0.7em;margin-left:.16em;
  color:var(--c-scale);
}
.cover-title .scale-icon svg{width:100%;height:100%;stroke-width:1.6;}
.cover-sub{
  margin-top:26px;max-width:620px;font-size:17.5px;line-height:1.6;color:var(--ink-soft);
}
.cover-flow{
  display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;gap:clamp(3px,0.8vw,10px);margin-top:56px;
  max-width:none;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw);
  padding-left:12px;padding-right:12px;box-sizing:border-box;
}
.flow-step{
  display:flex;align-items:center;gap:clamp(5px,1vw,12px);padding:clamp(9px,1.4vw,16px) clamp(8px,2vw,24px);
  border-radius:999px;white-space:nowrap;flex-shrink:1;min-width:0;
  border:1.5px solid var(--line);background:var(--card);
  font-size:clamp(10.5px,1.3vw,15.5px);font-weight:700;color:var(--ink-soft);
  transition:border-color .2s ease, color .2s ease, transform .2s ease, box-shadow .2s ease;
}
.flow-step:hover{border-color:var(--c-teal);color:var(--c-teal);transform:translateY(-2px);box-shadow:var(--shadow);}
.flow-step .flow-icon{width:clamp(15px,1.8vw,22px);height:clamp(15px,1.8vw,22px);display:flex;color:var(--c-teal);flex-shrink:0;}
.flow-step[data-flow-target="growth-plans"] .flow-icon,
.flow-step[data-flow-target="growth-plans"]:hover{color:var(--c-scale);}
.flow-arrow{width:clamp(10px,1.2vw,18px);height:clamp(10px,1.2vw,18px);color:var(--line);flex-shrink:0;}
@media (max-width:900px){
  .flow-step .flow-label{display:none;}
  .flow-step{padding:11px;gap:0;flex-shrink:0;}
}

/* section heading pattern used across sections */
.page-section{padding-top:0;padding-bottom:108px;position:relative;}
#summary{padding-bottom:32px;}
.page-section:first-of-type{padding-top:0;}
.section-divider{
  display:flex;align-items:center;gap:18px;
  padding:56px 0;
}
.section-divider .sd-line{flex:1;height:1px;background:var(--line);}
.section-divider .sd-chip{
  display:flex;align-items:center;gap:9px;flex-shrink:0;
  padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper-raise);
  font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft);
}
.section-divider .sd-chip .sd-num{
  font-family:var(--serif);font-weight:800;color:var(--c-navy);font-size:12.5px;
}
.section-head{padding-bottom:44px;}
.section-head:has(> h2:last-child){padding-bottom:22px;}
.section-head .eyebrow{margin-bottom:16px;}
.section-head h2{font-size:clamp(26px,3.4vw,38px);max-width:780px;}
.section-head h2 .scale-text{color:var(--c-scale);}
.section-head .desc{margin-top:14px;max-width:620px;font-size:15px;color:var(--ink-soft);line-height:1.6;}
@media (max-width:700px){ .page-section{padding-bottom:64px;} .section-divider{padding:36px 0;} }

.section-decor{overflow:hidden;}
.section-motif{
  position:absolute;top:6px;right:0;width:44px;height:44px;
  opacity:.16;pointer-events:none;z-index:0;color:var(--c-navy);
}
.section-motif svg{width:100%;height:100%;}
.section-motif .icon{width:100%;height:100%;}
#build .section-motif{color:var(--c-gold);}
#growth-plans .section-motif{color:var(--c-scale);}
#summary .section-motif{color:var(--c-cobalt);}
.section-decor > .section-head, .section-decor > .model-split, .section-decor > .build-tabs, .section-decor > .build-panels, .section-decor > .allplans-grid, .section-decor > .traj-card, .section-decor > .summary-cta, .section-decor > footer{
  position:relative;z-index:1;
}
@media (max-width:700px){ .section-motif{display:none;} }

/* ============ GROWTH MODEL (build/scale/lead — staircase + split panel) ============ */
.model-split{
  display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start;
}
@media (max-width:900px){ .model-split{grid-template-columns:1fr;gap:28px;} }

.model-left{display:flex;flex-direction:column-reverse;gap:24px;position:relative;}

.model-card{
  display:flex;align-items:center;gap:11px;padding:15px;border-radius:14px;
  height:109px;width:68%;box-sizing:border-box;
  border:3px solid transparent;background:var(--stage-accent);color:#fff;
  cursor:pointer;text-align:left;position:relative;overflow:visible;z-index:1;
  transition:transform .25s ease, box-shadow .25s ease, border-color .2s ease, outline-color .2s ease;
  opacity:.62;transform:scale(.96);
  outline:3px solid transparent;outline-offset:0px;
}
.model-card.step-2{margin-left:11%;}
.model-card.step-3{margin-left:22%;}
@media (max-width:520px){
  .model-card{width:100%;}
  .model-card.step-2{margin-left:7%;}
  .model-card.step-3{margin-left:14%;}
}
.model-card:hover{opacity:.85;}
.model-card.is-active{
  opacity:1;transform:scale(1);
  box-shadow:var(--shadow-lg);
  border-color:#fff;
  outline:3px solid var(--stage-accent);
  outline-offset:4px;
}
.model-card .mc-icon{
  width:34px;height:34px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.2);
}
.model-card .mc-icon .icon{width:18px;height:18px;color:#fff;}
.model-card .mc-body{flex:1;min-width:0;}
.model-card h3{font-size:15px;font-weight:800;color:#fff;margin-bottom:2px;font-family:var(--serif);}
.model-card .stage-oneline{
  font-size:10.5px;color:rgba(255,255,255,.88);line-height:1.3;
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
}
.model-card .mc-arrow{
  width:21px;height:21px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.16);color:#fff;
  opacity:0;transform:translateX(-6px);
  transition:opacity .2s ease, transform .2s ease;
}
.model-card .mc-arrow .icon{width:12px;height:12px;}
.model-card.is-active .mc-arrow{opacity:1;transform:translateX(0);}

.model-right{min-width:0;}
.model-panel{display:none;}
.model-panel.is-active{display:block;animation:panelIn .35s ease both;}
.stage-desc{max-width:none;color:var(--ink-soft);font-size:15.5px;line-height:1.6;margin-bottom:28px;}
.highlight-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.highlight-card{
  display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:18px;
  background:var(--paper-raise);border:1px solid var(--line);border-radius:14px;
  transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease;
}
.highlight-card:hover{border-color:var(--stage-accent,var(--c-navy));transform:translateY(-2px);box-shadow:var(--shadow);}
.highlight-card .hc-icon{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb, var(--stage-accent, var(--c-navy)) 16%, transparent);
  color:var(--stage-accent,var(--c-navy));
}
.highlight-card .hc-icon .icon{width:19px;height:19px;}
.highlight-card .hc-title{font-size:14.5px;font-weight:700;color:var(--ink);margin-bottom:3px;line-height:1.3;}
.highlight-card .hc-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.45;}
.model-jump{
  display:inline-flex;align-items:center;gap:9px;margin-top:24px;padding:13px 20px;border-radius:11px;
  background:var(--stage-accent,var(--c-navy));color:#fff;font-size:14px;font-weight:700;
  transition:transform .15s ease, box-shadow .15s ease;
}
.model-jump:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg);}
.model-jump .icon{width:15px;height:15px;}
@media (prefers-reduced-motion: reduce){ .model-card, .model-panel, .highlight-card, .model-jump{transition:none;animation:none;} }

/* ============ BUILD TABS ============ */
.build-tabs{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:36px;
  border-bottom:1.5px solid var(--line);padding-bottom:0;
}
.build-tab{
  display:inline-flex;align-items:center;gap:8px;
  padding:12px 6px;margin-bottom:-1.5px;border-bottom:2.5px solid transparent;
  font-size:14.5px;font-weight:700;color:var(--ink-soft);
  transition:color .18s ease, border-color .18s ease;
}
.build-tab .icon{width:16px;height:16px;}
.build-tab:hover{color:var(--ink);}
.build-tab.is-active{color:var(--c-navy);border-bottom-color:var(--c-navy);}
@media (max-width:820px){
  .build-tabs{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;}
  .build-tabs::-webkit-scrollbar{display:none;}
  .build-tab{white-space:nowrap;flex-shrink:0;padding:12px 10px;}
}

.build-panels{position:relative;}
.build-panel{display:none;}
.build-panel.is-active{display:block;animation:panelIn .35s ease both;}
@keyframes panelIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){ .build-panel.is-active{animation:none;} }

.build-placeholder{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:88px 24px;border:1.5px dashed var(--line);border-radius:18px;background:var(--paper-raise);
}
.build-placeholder .bp-icon{
  width:56px;height:56px;border-radius:16px;margin-bottom:20px;
  display:flex;align-items:center;justify-content:center;
  background:var(--c-navy-pale);color:var(--c-navy);
}
.build-placeholder .bp-icon .icon{width:28px;height:28px;}
.build-placeholder .bp-title{font-family:var(--serif);font-size:20px;font-weight:800;color:var(--ink);margin-bottom:8px;}
.build-placeholder .bp-note, .build-placeholder .bp-sub{font-size:14px;color:var(--ink-soft);}

/* ============ PRODUCT-MARKET FIT tab ============ */
.pmf-stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px;
}
@media (max-width:700px){ .pmf-stats{grid-template-columns:1fr 1fr;} }
.pmf-stat{background:var(--card);padding:16px 14px;text-align:center;}
.pmf-stat .v{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--c-navy-deep);}
.pmf-stat .l{font-size:10.5px;color:var(--ink-soft);margin-top:4px;font-weight:600;}
.pmf-caps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media (max-width:1000px){ .pmf-caps{grid-template-columns:1fr 1fr;} }
@media (max-width:560px){ .pmf-caps{grid-template-columns:1fr;} }
.pmf-cap{
  padding:14px;background:var(--paper-raise);border:1px solid var(--line);border-radius:12px;
  transition:border-color .2s ease, transform .2s ease;
}
.pmf-cap:hover{border-color:var(--c-navy);transform:translateY(-2px);}
.pmf-cap-icon{
  width:32px;height:32px;border-radius:9px;margin-bottom:9px;
  display:flex;align-items:center;justify-content:center;
  background:var(--c-navy-pale);color:var(--c-navy);
}
.pmf-cap-icon .icon{width:17px;height:17px;}
.pmf-cap-title{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.3;margin-bottom:8px;min-height:32px;}
.pmf-cap-metric{font-size:11px;color:var(--ink-soft);}
.pmf-cap-metric .tab{font-family:var(--serif);font-weight:800;color:var(--c-navy);font-size:13px;}

.pmf-clients{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);}
.pmf-clients-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
.pmf-sector-pills{display:flex;flex-wrap:wrap;gap:6px;}
.pmf-sector-pill{
  font-size:11px;font-weight:700;color:var(--c-jade,var(--c-navy));background:var(--c-jade-pale,var(--paper-raise));
  border-radius:999px;padding:5px 12px;
}
.pmf-client-grid{display:flex;flex-wrap:wrap;gap:8px;}
.pmf-client-chip{
  font-size:12px;font-weight:700;color:var(--ink-soft);background:var(--paper-raise);
  border:1px solid var(--line);border-radius:8px;padding:7px 12px;line-height:1.2;
  transition:border-color .2s ease,color .2s ease;
}
.pmf-client-chip:hover{border-color:var(--c-navy);color:var(--c-navy);}

/* ============ DELIVERY CASE STUDIES tab ============ */
.case-slider{width:100%;}
.case-slide-track{position:relative;}
.case-slide{display:none;animation:panelIn .3s ease both;}
.case-slide.is-active{display:block;}
.case-card{
  border-radius:18px;overflow:hidden;background:var(--card);
  border:1px solid color-mix(in srgb, var(--v-accent,var(--c-navy)) 28%, var(--line));
}
.case-hero{
  position:relative;height:min(38vh,320px);background-size:cover;background-position:center;
  display:flex;flex-direction:column;justify-content:flex-end;padding:24px 28px;
}
.case-hero-scrim{
  position:absolute;inset:0;
  background:linear-gradient(180deg, color-mix(in srgb, var(--v-accent,var(--c-navy)) 10%, transparent) 0%, rgba(10,14,20,.78) 100%);
}
.case-hero-logo{
  position:absolute;top:20px;right:24px;width:56px;height:56px;border-radius:12px;
  background:#fff;display:flex;align-items:center;justify-content:center;padding:7px;box-shadow:var(--shadow-lg);z-index:1;
}
.case-hero-logo img{width:100%;height:100%;object-fit:contain;}
.case-hero-text{position:relative;z-index:1;color:#fff;}
.case-kicker{font-size:11px;font-weight:700;color:#fff;opacity:.85;text-transform:uppercase;letter-spacing:.05em;}
.case-name{font-family:var(--serif);font-size:26px;font-weight:800;color:#fff;margin:4px 0 6px;}
.case-hero-text .case-tag{font-size:12px;font-weight:700;color:#fff;opacity:.9;text-transform:uppercase;letter-spacing:.03em;}
.case-body{padding:26px 28px 28px;}
.case-line{font-size:16px;font-weight:600;color:var(--ink);line-height:1.5;margin:0 0 18px;}
.case-meta-row{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:18px;border-bottom:1px solid var(--line);}
.case-meta{display:flex;flex-direction:column;gap:2px;}
.case-meta .l{font-size:10px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.case-meta .v{font-size:13px;color:var(--ink);font-weight:700;}
.case-head-stats{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:22px;}
.case-grid-2{display:grid;grid-template-columns:1fr 1.3fr;gap:28px;margin-bottom:22px;}
@media (max-width:800px){ .case-grid-2{grid-template-columns:1fr;} }
.case-projects ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;}
.case-projects li{display:flex;align-items:flex-start;gap:7px;font-size:13px;color:var(--ink-soft);line-height:1.4;}
.case-projects li .icon{width:10px;height:10px;color:var(--v-accent,var(--c-navy));flex-shrink:0;margin-top:4px;}
.case-narrative{display:flex;flex-direction:column;gap:16px;}
.case-narrative-block p{font-size:13px;color:var(--ink-soft);line-height:1.5;margin:8px 0 0;}
.case-stats{display:flex;gap:28px;flex-wrap:wrap;padding-top:18px;border-top:1px dashed color-mix(in srgb, var(--v-accent,var(--c-navy)) 35%, var(--line));}
.case-stat{display:flex;flex-direction:column;gap:3px;max-width:220px;}
.case-stat .v{font-family:var(--serif);font-size:22px;font-weight:800;color:var(--v-accent,var(--c-navy));}
.case-stat .l{font-size:11.5px;color:var(--ink-soft);line-height:1.35;}
.case-slider-nav{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:22px;}
.case-nav-btn{
  width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--paper-raise);border:1px solid var(--line);color:var(--ink);cursor:pointer;
  transition:border-color .2s ease, background .2s ease;
}
.case-nav-btn:hover{border-color:var(--c-navy);color:var(--c-navy);}
.case-nav-btn:first-child .icon{transform:rotate(180deg);}
.case-dots{display:flex;gap:7px;}
.case-dot{width:8px;height:8px;border-radius:50%;background:var(--line);border:none;cursor:pointer;padding:0;transition:background .2s ease,transform .2s ease;}
.case-dot.is-active{background:var(--c-scale);transform:scale(1.25);}

/* ============ TECH READY TO SCALE tab ============ */
.ready-hero{
  display:flex;align-items:center;gap:16px;padding:16px 20px;margin-bottom:18px;border-radius:14px;
  background:color-mix(in srgb, var(--c-scale) 10%, var(--paper-raise));border:1px solid color-mix(in srgb, var(--c-scale) 25%, var(--line));
}
.ready-hero-icon{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--c-scale);color:#fff;
}
.ready-hero-icon .icon{width:20px;height:20px;}
.ready-hero p{margin:0;font-size:13.5px;color:var(--ink);line-height:1.5;}
.ready-integrations{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
@media (max-width:700px){ .ready-integrations{grid-template-columns:1fr;} }
.ready-integration{padding:14px;border-radius:12px;background:var(--paper-raise);border:1px solid var(--line);}
.ready-int-icon{
  width:32px;height:32px;border-radius:9px;margin-bottom:9px;
  display:flex;align-items:center;justify-content:center;background:var(--c-navy-pale);color:var(--c-navy);
}
.ready-int-icon .icon{width:17px;height:17px;}
.ready-int-title{font-family:var(--serif);font-size:14px;font-weight:800;color:var(--ink);margin-bottom:4px;}
.ready-int-sub{font-size:11.5px;color:var(--ink-soft);line-height:1.4;}
.ready-mod-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
.ready-mod-chip{
  padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--ink);
  background:var(--paper-raise);border:1px solid var(--line);
}

/* ============ VERTICALS: 50/50 split (2-col card list + table panel) ============ */
.verticals-split{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start;}
@media (max-width:860px){ .verticals-split{grid-template-columns:1fr;} }

.sector-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:520px){ .sector-grid{grid-template-columns:1fr;} }
.sector-card{
  background:color-mix(in srgb, var(--v-accent,var(--c-navy)) 14%, var(--card));
  border:1px solid color-mix(in srgb, var(--v-accent,var(--c-navy)) 28%, var(--line));
  border-radius:12px;
  padding:12px 14px;text-align:left;box-shadow:var(--shadow);width:100%;
  transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease, background .2s ease;
  display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;
}
.sector-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:var(--v-accent,var(--c-navy));
  transform:scaleX(0);transform-origin:left;transition:transform .25s ease;
}
.sector-card:hover, .sector-card.is-active{
  transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--v-accent,var(--c-navy));
  background:color-mix(in srgb, var(--v-accent,var(--c-navy)) 22%, var(--card));
}
.sector-card:hover::before, .sector-card.is-active::before{transform:scaleX(1);}
.sector-card .sc-top{display:flex;align-items:center;gap:10px;}
.sector-card .sc-icon{
  width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;background:color-mix(in srgb, var(--v-accent,var(--c-navy)) 16%, transparent);
}
.sector-card .sc-name{flex:1;min-width:0;}
.sector-card h3{font-size:14.5px;margin-bottom:1px;line-height:1.25;}
.sector-card .sc-region{font-size:10.5px;color:var(--ink-soft);font-weight:600;}
.sector-card .sc-arrow{
  width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  transition:all .2s ease;
}
.sector-card .sc-arrow .icon{width:11px;height:11px;}
.sector-card:hover .sc-arrow, .sector-card.is-active .sc-arrow{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.sector-card.is-active .sc-arrow{transform:rotate(90deg);}
.sector-card:hover .sc-arrow{transform:rotate(45deg);}
.sector-card .sc-customers{
  list-style:none;margin:0;padding:0;
  display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;
}
.sector-card .sc-customers li{
  display:flex;align-items:flex-start;gap:6px;font-size:11px;color:var(--ink-soft);line-height:1.3;
}
.sector-card .sc-customers li .icon{width:9px;height:9px;color:var(--v-accent,var(--c-navy));flex-shrink:0;margin-top:2.5px;}
.sector-card .sc-customers li.sc-more{color:var(--v-accent,var(--c-navy));font-weight:700;font-size:10.5px;padding-left:15px;}
.sector-card .sc-stats{display:flex;gap:14px;flex-shrink:0;padding-top:8px;border-top:1px solid var(--line);}
.sector-card .sc-stat .v{font-family:var(--serif);font-size:14px;font-weight:700;color:var(--c-navy-deep);}
.sector-card .sc-stat .l{font-size:8px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-top:0px;font-weight:600;}

/* ============ VERTICAL DETAIL (right-side panel) ============ */
.verticals-table-col{position:relative;min-width:0;}
.vertical-detail{display:none;}
.vertical-detail.is-active{display:block;animation:panelIn .3s ease both;}

.vd-card{
  border-left:3px solid var(--v-accent,var(--c-navy));
  padding:2px 0 2px 20px;
}
.vd-head{
  display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:1.5px solid var(--v-accent,var(--c-navy));margin-bottom:14px;
}
.vd-head-name{display:flex;align-items:center;gap:10px;}
.vd-icon{font-size:20px;}
.vd-head h3{font-size:17px;margin-bottom:1px;}
.sdh-stats{display:flex;gap:20px;flex-wrap:wrap;}
.sdh-stat{padding:0 0 0 14px;border-left:1px solid var(--line);}
.sdh-stat:first-child{padding-left:0;border-left:none;}
.sdh-stat .v{font-family:var(--serif);font-size:16px;font-weight:700;color:var(--c-navy-deep);}
.sdh-stat .l{font-size:8.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-top:1px;font-weight:700;}

.vd-customers{
  list-style:none;margin:0 0 14px;padding:0;
  display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;
}
.vd-customers li{
  display:flex;align-items:flex-start;gap:6px;font-size:12px;color:var(--ink-soft);line-height:1.35;
}
.vd-customers li .icon{width:9px;height:9px;color:var(--v-accent,var(--c-navy));flex-shrink:0;margin-top:3px;}
@media (max-width:520px){ .vd-customers{grid-template-columns:1fr;} }

.client-table-wrap{overflow-x:auto;overflow-y:auto;max-height:min(46vh,420px);}
table.clients{width:100%;border-collapse:collapse;font-size:13px;min-width:380px;}
table.clients caption{text-align:left;font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:10px;caption-side:top;}
table.clients th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);
  font-weight:700;padding:8px 14px 10px;border-bottom:1.5px solid var(--line);
  position:sticky;top:0;background:var(--paper-raise);z-index:1;
}
table.clients th.num, table.clients td.num{text-align:right;}
table.clients td{padding:11px 14px;border-bottom:1px solid var(--line);}
table.clients tbody tr{transition:background .15s;}
table.clients tbody tr:hover{background:var(--c-navy-pale);}
table.clients tfoot td{
  padding:13px 14px;font-weight:700;border-top:1.5px solid var(--ink);border-bottom:none;
  font-family:var(--serif);font-size:14.5px;
}
.empty-note{
  padding:28px;text-align:center;color:var(--ink-soft);font-size:14px;
  background:var(--card);border:1px dashed var(--line);border-radius:12px;margin-top:28px;
}
.two-col-tables{display:grid;grid-template-columns:1fr 1fr;gap:56px;}
@media (max-width:820px){.two-col-tables{grid-template-columns:1fr;}}

/* ============ GROWTH PLAN CARDS ============ */
.gp-card{
  background:color-mix(in srgb, var(--v-accent,var(--c-navy)) 10%, var(--card));
  border:1.5px solid color-mix(in srgb, var(--v-accent,var(--c-navy)) 30%, var(--line));
  border-radius:16px;border-top:5px solid var(--v-accent,var(--c-navy));
  padding:28px clamp(18px,3vw,32px);box-shadow:var(--shadow);
  position:relative;
}
.gp-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
.gp-head h3{font-size:18px;}
.gp-ask{
  display:flex;align-items:baseline;gap:8px;
  background:color-mix(in srgb, var(--v-accent,var(--c-navy)) 16%, transparent);
  padding:7px 15px;border-radius:10px;
}
.gp-ask .v{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--v-accent,var(--c-navy));}
.gp-ask .l{font-size:11px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;}
.gp-cols{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
@media (max-width:900px){.gp-cols{grid-template-columns:1fr 1fr;}}
@media (max-width:560px){.gp-cols{grid-template-columns:1fr;}}
.gp-col .gc-label, .case-projects .gc-label, .case-narrative-block .gc-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:800;
  margin-bottom:8px;display:inline-flex;align-items:center;gap:6px;
  padding:4px 9px;border-radius:6px;
  background:color-mix(in srgb, var(--v-accent,var(--c-navy)) 15%, transparent);
  color:var(--v-accent,var(--c-navy));
}
.gp-col .gc-label .icon, .case-projects .gc-label .icon, .case-narrative-block .gc-label .icon{width:10px;height:10px;}
.gp-col ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;}
.gp-col li{font-size:12.5px;line-height:1.4;padding-left:13px;position:relative;color:var(--ink);}
.gp-col li::before{content:'';position:absolute;left:0;top:6px;width:5px;height:5px;border-radius:50%;background:var(--v-accent,var(--c-coral));}
.gp-col .big-stat{font-family:var(--serif);font-size:23px;font-weight:700;color:var(--good);}

/* ============ GROWTH PLANS comparison grid (own section, always visible) ============ */
.allplans-grid{
  display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);
  gap:16px;overflow-x:auto;padding-bottom:8px;
}

/* compact comparison-card variant: same info, stacked for a narrow column */
.gp-card--compare{padding:18px;display:flex;flex-direction:column;}
.gp-card--compare .gp-head{flex-direction:column;align-items:flex-start;gap:8px;margin-bottom:0;margin-top:6px;}
.gp-card--compare .gp-head h3{font-size:14.5px;}
.gp-card--compare .gp-ask{width:100%;justify-content:space-between;padding:5px 12px;}
.gp-card--compare .gp-ask .v{font-size:17px;}
.gp-card--compare .gp-cols{grid-template-columns:1fr;gap:0;}
.gp-card--compare .gp-col{padding-top:13px;margin-top:13px;border-top:1px dashed color-mix(in srgb, var(--v-accent,var(--c-navy)) 35%, var(--line));}
.gp-card--compare .gp-col:first-child{padding-top:13px;margin-top:13px;border-top:1px dashed color-mix(in srgb, var(--v-accent,var(--c-navy)) 35%, var(--line));}
.gp-card--compare .gp-col .big-stat{font-size:17px;}
.gp-card--compare .gp-col p{margin:0;}

/* ============ OVERALL SUMMARY — trajectory graph + phase notes + the ask ============ */
.traj-card{
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:clamp(16px,2.4vw,22px);box-shadow:var(--shadow);margin-bottom:18px;
}
.traj-split{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:stretch;}
@media (max-width:860px){ .traj-split{grid-template-columns:1fr;} }

.traj-phases{display:flex;flex-direction:column;gap:10px;}
.curve-svg-wrap{position:relative;align-self:center;width:100%;}
.curve-svg-wrap svg{width:100%;height:auto;display:block;max-height:360px;}
.curve-path-anim{
  stroke-dasharray:1400;stroke-dashoffset:1400;transition:stroke-dashoffset 1.8s cubic-bezier(.16,1,.3,1);
}
.curve-svg-wrap.is-visible .curve-path-anim{stroke-dashoffset:0;}
.curve-area-anim{opacity:0;transition:opacity 1.2s ease .5s;}
.curve-svg-wrap.is-visible .curve-area-anim{opacity:1;}
.curve-enddot{
  opacity:0;transform-origin:center;transform:scale(.4);
  transition:opacity .5s ease 1.6s, transform .6s cubic-bezier(.34,1.56,.64,1) 1.6s;
}
.curve-svg-wrap.is-visible .curve-enddot{opacity:1;transform:scale(1);}
@media (prefers-reduced-motion: reduce){
  .curve-path-anim, .curve-area-anim, .curve-enddot{transition:none;stroke-dashoffset:0;opacity:1;transform:scale(1);}
}

.phase-card{
  padding:14px 16px;background:var(--paper-raise);border:1px solid var(--line);border-radius:12px;position:relative;
  opacity:0;transform:translateY(10px);flex:1;display:flex;flex-direction:column;
  transition:opacity .45s ease, transform .45s cubic-bezier(.16,1,.3,1), border-color .2s ease;
}
.phase-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;border-radius:12px 12px 0 0;background:var(--phase-color);}
.phase-card.is-visible{opacity:1;transform:translateY(0);}
.phase-card:hover{border-color:var(--phase-color);}
@media (prefers-reduced-motion: reduce){ .phase-card{opacity:1;transform:none;} }
.phase-card .co-phase{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--phase-color);display:block;margin-bottom:6px;}
.phase-card p{font-size:12px;color:var(--ink-soft);line-height:1.45;margin:0;flex:1;}
.phase-card--lead{border-color:color-mix(in srgb, var(--c-scale) 40%, var(--line));}
.curve-annot{opacity:0;transition:opacity .6s ease .9s;}
.curve-svg-wrap.is-visible .curve-annot{opacity:1;}
@media (prefers-reduced-motion: reduce){ .curve-annot{transition:none;opacity:1;} }

.summary-cta{
  text-align:center;padding:22px 24px;margin-bottom:16px;border-radius:18px;
  background:#0f2621;
  color:#fff;
}
.summary-cta h3{font-size:clamp(18px,2.2vw,24px);color:#fff;margin-bottom:6px;}
.summary-cta p{font-size:13px;line-height:1.5;color:rgba(255,255,255,.82);max-width:600px;margin:0 auto;}

footer{
  border-top:1px solid var(--line);padding:20px 0 28px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
  font-size:12.5px;color:var(--ink-soft);
}

@media (max-width:700px){
  .sdh-stats{gap:24px;}
}

/* ============ SHORT-VIEWPORT FIT (laptops with browser chrome eating vertical space) ============ */

  .cover{min-height:calc(100svh - 58px);}
  .cover-inner{padding-top:56px;padding-bottom:48px;}
  .cover-title{font-size:clamp(28px,4.6vw,54px);}
  .cover-sub{margin-top:16px;font-size:15px;}
  .cover-flow{margin-top:28px;}
  .flow-step{padding:clamp(7px,1.1vw,12px) clamp(7px,1.8vw,18px);}

  .page-section{padding-bottom:56px;}

  .sector-grid{gap:8px;}

  .client-table-wrap{max-height:min(30vh,300px);}

  .pmf-stats{margin-bottom:12px;}
  .pmf-stat{padding:11px 10px;}
  .pmf-stat .v{font-size:19px;}
  .pmf-caps{gap:8px;}
  .pmf-cap{padding:10px;}
  .pmf-cap-title{font-size:11.5px;min-height:auto;margin-bottom:6px;}
  .case-hero{height:min(30vh,220px);padding:16px 18px;}

  .traj-split{gap:16px;}
  .curve-svg-wrap svg{max-height:320px;}
  .phase-card{padding:10px 12px;}
  .phase-card p{font-size:11.5px;}
  .summary-cta{padding:16px 20px;margin-bottom:10px;}
  footer{padding:12px 0 16px;}
}
@media (max-height:780px){
  .cover-title{font-size:clamp(24px,4vw,44px);}
  .page-section{padding-bottom:40px;}
  .summary-cta{padding:12px 16px;}
  .summary-cta h3{font-size:16px;}
  .summary-cta p{font-size:11.5px;}
  .section-head{padding-bottom:16px;}
  .model-card{height:80px;}
  .client-table-wrap{max-height:min(24vh,240px);}

  .sector-card{padding:7px 9px;gap:4px;}

  .sector-card .sc-stats{padding-top:5px;}

  .pmf-cap-title{font-size:10.5px;margin-bottom:4px;}
  .pmf-cap-metric{font-size:10px;}

  .case-hero{height:180px;padding:12px 14px;}
  .case-hero-logo{width:42px;height:42px;top:12px;right:14px;}
  .case-name{font-size:17px;margin:2px 0 4px;}
  .case-body{padding:14px 15px 16px;}
  .case-line{font-size:12px;margin-bottom:10px;}
  .case-meta-row{gap:14px;margin-bottom:12px;padding-bottom:12px;}
  .case-head-stats{gap:12px;margin-bottom:12px;}
  .case-grid-2{gap:12px;margin-bottom:12px;}
  .case-stats{gap:12px;padding-top:8px;}

  .gp-cols{gap:0;}
  .allplans-grid{gap:10px;}
  .gp-card--compare{padding:11px;}
  .gp-card--compare .gp-head{gap:6px;margin-top:0;}

/* ===================== HELPERS ===================== */
function fmtCr(n){ if(n===null||n===undefined) return '—'; return '₹' + n.toFixed(2) + ' Cr'; }
// Robust smooth-scroll: some browser/automation contexts silently no-op native smooth
// scrollIntoView, leaving the page stuck. Verify progress and fall back to instant.
function smoothScrollTo(el, opts){
  if(!el) return;
  const startY = window.scrollY;
  el.scrollIntoView(Object.assign({behavior:'smooth'}, opts));
  setTimeout(()=>{
    if(Math.abs(window.scrollY - startY) < 2){
      el.scrollIntoView(Object.assign({}, opts, {behavior:'instant'}));
    }
  }, 350);
}
// Wait for a CSS grid-template-rows expand transition to finish before scrolling,
// so the scroll animation and the expand animation never fight each other.
function afterExpand(el, cb){
  let done = false;
  const finish = ()=>{ if(done) return; done = true; cb(); };
  el.addEventListener('transitionend', finish, {once:true});
  setTimeout(finish, 500);
}
function sum(arr, key){ return arr.reduce((a,c)=> a + (c[key]||0), 0); }
// Some verticals print an official ARR/TCV total; others only list named top accounts —
// for those, use the sum of named accounts as the displayed (partial) figure.
function effectiveArr(s){ return s.arr !== null ? s.arr : sum(s.clients,'arr'); }
function effectiveTcv(s){ return s.tcv !== null ? s.tcv : sum(s.clients,'tcv'); }

function growthCurveSVG(){
  const extraTop = 140; // dedicated headroom for Continuous Growth, added above everything else
  const W = 1040, H = 360 + extraTop, padX = 40, padTop = 64 + extraTop, padBottom = 40;
  const yTop = padTop, yBase = H - padBottom;
  const usableH = yBase - yTop;
  // Normalized growth budget (0 = baseline, 1 = peak) across Foundational/Interrupted —
  // guarantees every point in those two phases stays within [yTop, yBase], nothing can clip.
  // yBase and usableH are identical to before extraTop existed, so those two phases render
  // pixel-identical; only the canvas grew upward to make room for a steeper climb.
  const toY = frac => yBase - Math.max(0, Math.min(1, frac)) * usableH;
  // Continuous Growth is allowed to climb past frac=1, using extraTop's headroom above
  // yTop so it can be much steeper with no flat tail and no clipping.
  const toYExtended = frac => yBase - Math.max(0, frac) * usableH;

  const buildPts = [];
  for(let i=0;i<=10;i++){
    const t = i/10;
    const x = padX + t * (W*0.32 - padX);
    buildPts.push([x, toY(t*t * 0.16)]);
  }
  const stepPts = [];
  const stepStartX = W*0.32, stepEndX = W*0.62;
  const steps = 5;
  let frac = 0.16;
  const stepRise = 0.11;
  for(let i=0;i<=steps;i++){
    const x0 = stepStartX + (i/steps)*(stepEndX-stepStartX);
    stepPts.push([x0, toY(frac)]);
    frac += stepRise;
    stepPts.push([x0, toY(frac)]);
  }
  const leadPts = [];
  // Continuous Growth: rises for the entire segment, all the way to the last point —
  // no flat run anywhere. Starts exactly where Interrupted ends, and climbs ~80% further
  // (using headroom above yTop) than before for a much sharper incline.
  const leadStartX = stepEndX, leadEndX = W - padX;
  const leadStartFrac = frac;
  const oldRise = 1 - leadStartFrac;
  const leadTargetFrac = leadStartFrac + oldRise * 3.2;
  for(let i=0;i<=20;i++){
    const t = i/20;
    const x = leadStartX + t*(leadEndX-leadStartX);
    const f = leadStartFrac + t * (leadTargetFrac - leadStartFrac);
    leadPts.push([x, toYExtended(f)]);
  }
  const toPath = pts => 'M ' + pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' L ');
  const allPts = [...buildPts, ...stepPts, ...leadPts];
  const fullPath = toPath(allPts);
  const areaPath = fullPath + ` L ${leadPts[leadPts.length-1][0]},${yBase} L ${buildPts[0][0]},${yBase} Z`;

  const gridLines = [0,1,2,3,4].map(i => {
    const y = yTop + (i/4)*usableH;
    return `<line x1="${padX}" y1="${y.toFixed(1)}" x2="${W-padX}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="${i===4?'0':'3,5'}"/>`;
  }).join('');

  const labelY = H - 16;
  const phaseLabels = `
    <text x="${(padX+stepStartX)/2}" y="${labelY}" fill="var(--ink-soft)" font-size="12" font-weight="600" text-anchor="middle" font-family="var(--sans)">FOUNDATIONAL</text>
    <text x="${(stepStartX+stepEndX)/2}" y="${labelY}" fill="var(--c-navy)" font-size="12" font-weight="600" text-anchor="middle" font-family="var(--sans)">INTERRUPTED</text>
    <text x="${(stepEndX+leadEndX)/2}" y="${labelY}" fill="var(--c-scale)" font-size="12" font-weight="700" text-anchor="middle" font-family="var(--sans)">CONTINUOUS GROWTH</text>
  `;
  const dividers = `
    <line x1="${stepStartX}" y1="${yTop-6}" x2="${stepStartX}" y2="${yBase+6}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2,4"/>
    <line x1="${stepEndX}" y1="${yTop-6}" x2="${stepEndX}" y2="${yBase+6}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2,4"/>
  `;
  const endDot = `<g class="curve-enddot">
    <circle cx="${leadPts[leadPts.length-1][0]}" cy="${leadPts[leadPts.length-1][1]}" r="6" fill="var(--c-scale)"/>
    <circle cx="${leadPts[leadPts.length-1][0]}" cy="${leadPts[leadPts.length-1][1]}" r="11" fill="var(--c-scale)" opacity="0.25"/>
  </g>`;

  function svgBadge(cx, topY, lines, opts){
    const color = opts.color;
    const chip = !!opts.chip;
    const padXb = chip ? 12 : 11, padYb = chip ? 7 : 8;
    const lineH = 14;
    const widths = lines.map(l => l.text.length * (l.bold ? 6.6 : 6.0) + (l.icon ? 15 : 0));
    const boxW = Math.max(...widths) + padXb*2;
    const boxH = chip ? 26 : (lineH*lines.length + padYb*2);
    let x = cx - boxW/2;
    x = Math.max(padX+2, Math.min(W-padX-boxW-2, x));
    const textLines = lines.map((l,i)=>{
      const ty = topY + padYb + (chip ? boxH/2 - padYb + 3 : lineH*i + 11);
      const anchorX = x + boxW/2;
      return `<text x="${anchorX}" y="${ty}" text-anchor="middle" font-family="var(--sans)" font-size="${l.bold?12:9.5}" font-weight="${l.bold?800:700}" fill="${l.color || '#fff'}" ${l.upper ? 'letter-spacing="0.03em"' : ''}>${l.icon ? '✦ ' : ''}${l.text}</text>`;
    }).join('');
    return `<g>
      <rect x="${x}" y="${topY}" width="${boxW}" height="${boxH}" rx="${chip?boxH/2:8}" fill="${color}"/>
      ${textLines}
    </g>`;
  }

  const foundMid = buildPts[Math.round(buildPts.length*0.5)];
  const foundBadgeH = 14*2 + 8*2;
  const foundBadge = svgBadge(foundMid[0], foundMid[1] - foundBadgeH + 4, [
    {text:'₹17.01 Cr ARR', bold:true},
    {text:'₹120.78 Cr TCV', bold:true},
  ], {color:'var(--c-navy)'});

  // "Right time to invest" marks the exact start of the Interrupted phase (end of Foundational),
  // with a dot on that point and a connector line up to the chip.
  const stepStartPt = stepPts[0];
  const investChipY = stepStartPt[1] - 44;
  const investBadge = svgBadge(stepStartPt[0], investChipY, [
    {text:'RIGHT TIME TO INVEST', bold:true, upper:true},
  ], {color:'var(--c-gold)', chip:true});
  const investMarker = `
    <line x1="${stepStartPt[0]}" y1="${investChipY+26}" x2="${stepStartPt[0]}" y2="${stepStartPt[1]-6}" stroke="var(--c-gold)" stroke-width="1.5" stroke-dasharray="2,3"/>
    <circle cx="${stepStartPt[0]}" cy="${stepStartPt[1]}" r="4.5" fill="var(--c-gold)"/>
    <circle cx="${stepStartPt[0]}" cy="${stepStartPt[1]}" r="8" fill="var(--c-gold)" opacity="0.25"/>
  `;

  const leadAnchorIdx = Math.round(leadPts.length*0.62);
  const leadAnchor = leadPts[leadAnchorIdx];
  const leadBadge = svgBadge(leadAnchor[0], leadAnchor[1] - 46, [
    {text:'NEW ARR TARGET', bold:false, upper:true},
    {text:'₹7.47 Cr', bold:true},
  ], {color:'var(--c-scale)'});

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Growth trajectory chart across Build, Scale, and Lead phases">
    <defs>
      <linearGradient id="curveFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--c-scale)" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="var(--c-scale)" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="curveStroke" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="var(--ink-soft)"/>
        <stop offset="35%" stop-color="var(--c-navy)"/>
        <stop offset="62%" stop-color="var(--c-navy)"/>
        <stop offset="78%" stop-color="var(--c-scale)"/>
        <stop offset="100%" stop-color="var(--c-scale)"/>
      </linearGradient>
    </defs>
    ${gridLines}
    ${dividers}
    <path class="curve-area-anim" d="${areaPath}" fill="url(#curveFill)"/>
    <path class="curve-path-anim" d="${fullPath}" fill="none" stroke="url(#curveStroke)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${endDot}
    ${phaseLabels}
    <g class="curve-annot">${foundBadge}${investMarker}${investBadge}${leadBadge}</g>
  </svg>`;
}

            <span class="co-phase">${CURVE_PHASES[1].label}</span>
            <p>${CURVE_PHASES[1].shortDesc}</p>
          </div>
          <div class="phase-card phase-card--lead" style="--phase-color:var(--c-scale)">
            <span class="co-phase">${CURVE_PHASES[2].label}</span>
            <p>${CURVE_PHASES[2].shortDesc}</p>
          </div>
        </div>
        <div class="curve-svg-wrap" id="curveSvgWrap">${growthCurveSVG()}</div>
      </div>
    </div>
    <div class="summary-cta reveal">
      <h3>Built for construction. By people from construction.</h3>
      <p>Land-and-expand across construction-tech — deepen where we're proven, activate where we're not, and compound. Build, through Scale, to Lead.</p>
    </div>
    <footer>
      <span>Inncircles · Business Plan</span>
      <span>Build → Scale → Lead</span>
    </footer>
  </section>`;
}

/* ===================== PAGE ASSEMBLY ===================== */

function renderDivider(sectionId){
  const idx = NAV_SECTIONS.findIndex(s=>s.id===sectionId);
  const s = NAV_SECTIONS[idx];
  return `
  <div class="wrap"><div class="section-divider">
    <span class="sd-line"></span>
    <span class="sd-chip"><span class="sd-num tab">${String(idx+1).padStart(2,'0')}</span>${icon(s.icon)}${s.label}</span>
    <span class="sd-line"></span>
  </div></div>`;
}

function buildPage(){
  const main = document.getElementById('main');
  main.innerHTML = [
    renderCover(),
    renderDivider('model'), renderModel(),
    renderDivider('build'), renderVerticals(),
    renderDivider('growth-plans'), renderGrowthPlans(),
    renderDivider('summary'), renderSummary(),
  ].join('');
}

/* ===================== NAV ===================== */

function buildNavRail(){
  const steps = document.getElementById('steps');
  steps.innerHTML = NAV_SECTIONS.map((v,i)=>`<button class="step" data-target="${v.id}"><span class="n tab">${String(i+1).padStart(2,'0')}</span><span class="lbl">${v.label}</span></button>`).join('');
  steps.querySelectorAll('.step').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const el = document.getElementById(btn.dataset.target);
      smoothScrollTo(el, {block:'start'});
    });
  });
}

function initFlowStrip(){
  document.querySelectorAll('.flow-step').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const el = document.getElementById(btn.dataset.flowTarget);
      smoothScrollTo(el, {block:'start'});
    });
  });
}

function initScrollSpy(){
  const sections = NAV_SECTIONS.map(v => document.getElementById(v.id)).filter(Boolean);
  const stepEls = Array.from(document.querySelectorAll('#steps .step'));
  function setActive(id){
    stepEls.forEach(el=>{
      const isActive = el.dataset.target === id;
      el.classList.toggle('active', isActive);
      if(isActive) el.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
    });
  }
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){ setActive(entry.target.id); }
    });
  }, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
  sections.forEach(s => io.observe(s));
  if(sections[0]) setActive(sections[0].id);
}

/* ===================== SCROLL REVEAL ===================== */

function initScrollReveal(){
  const els = document.querySelectorAll('.reveal, .phase-card');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        entry.target.classList.add('is-visible');
        io.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
  els.forEach((el,i)=>{
    if(el.classList.contains('phase-card')){
      el.style.transitionDelay = (i % 3) * 0.12 + 's';
    }
    io.observe(el);
  });
}

function initCurveAnimation(){
  const wrap = document.getElementById('curveSvgWrap');
  if(!wrap) return;
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      if(entry.isIntersecting){
        wrap.classList.add('is-visible');
        io.unobserve(wrap);
      }
    });
  }, { threshold: 0.35 });
  io.observe(wrap);
}

/* ===================== ACCORDIONS ===================== */

function setPanelOpen(panelEl, innerSelector, open){
  panelEl.classList.toggle('is-open', open);
}

function initModelAccordion(){
  document.querySelectorAll('.model-card').forEach(card=>{
    const stage = card.dataset.stage;
    const panel = document.querySelector(`.model-panel[data-panel="${stage}"]`);
    function select(){
      document.querySelectorAll('.model-card').forEach(c=>{c.classList.remove('is-active');c.setAttribute('aria-expanded','false');});
      document.querySelectorAll('.model-panel').forEach(p=>p.classList.remove('is-active'));
      card.classList.add('is-active');
      card.setAttribute('aria-expanded','true');
      panel.classList.add('is-active');
    }
    card.addEventListener('click', select);
  });
  const first = document.querySelector('.model-card[data-stage="01"]');
  if(first) first.click();
  document.querySelectorAll('.model-jump').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      smoothScrollTo(document.getElementById(btn.dataset.jumpTarget), {block:'start'});
    });
  });
}

function initBuildTabs(){
  const tabs = document.querySelectorAll('.build-tab');
  tabs.forEach(tab=>{
    tab.addEventListener('click', ()=>{
      const id = tab.dataset.buildTab;
      document.querySelectorAll('.build-tab').forEach(t=>t.classList.toggle('is-active', t===tab));
      document.querySelectorAll('.build-panel').forEach(p=>{
        p.classList.toggle('is-active', p.dataset.buildPanel === id);
      });
    });
  });
}

function initDeliverySlider(){
  const slider = document.querySelector('.case-slider');
  if(!slider) return;
  const slides = Array.from(slider.querySelectorAll('.case-slide'));
  const dots = Array.from(slider.querySelectorAll('.case-dot'));
  let idx = 0;
  function show(i){
    idx = (i + slides.length) % slides.length;
    slides.forEach((s,j)=> s.classList.toggle('is-active', j===idx));
    dots.forEach((d,j)=> d.classList.toggle('is-active', j===idx));
  }
  slider.querySelector('[data-case-nav="prev"]').addEventListener('click', ()=> show(idx-1));
  slider.querySelector('[data-case-nav="next"]').addEventListener('click', ()=> show(idx+1));
  dots.forEach((d,j)=> d.addEventListener('click', ()=> show(j)));
}

function initVerticalAccordion(){
  const cards = document.querySelectorAll('.sector-card[data-vertical]');
  function select(card){
    const id = card.dataset.vertical;
    cards.forEach(c=>{c.classList.toggle('is-active', c===card);c.setAttribute('aria-expanded', c===card ? 'true':'false');});
    document.querySelectorAll('.vertical-detail').forEach(d=>{
      d.classList.toggle('is-active', d.dataset.verticalDetail === id);
    });
  }
  cards.forEach(card=>{
    card.addEventListener('click', ()=> select(card));
  });
  if(cards[0]) select(cards[0]);
}

/* ===================== THEME ===================== */
function initTheme(){
  const root = document.documentElement;
  const toggle = document.getElementById('themeToggle');
  root.setAttribute('data-theme', 'light');
  toggle.innerHTML = icon('moon');
  toggle.addEventListener('click', ()=>{
    const current = root.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    toggle.innerHTML = next === 'dark' ? icon('sun') : icon('moon');
  });
}

/* ===================== INIT ===================== */
buildPage();
buildNavRail();
initFlowStrip();
initTheme();
initScrollSpy();
initScrollReveal();
initCurveAnimation();
initModelAccordion();
initBuildTabs();
initVerticalAccordion();
initDeliverySlider();

</script>
